name: Python synthetic data generator checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate generated records
        run: python -m src.generator --validate-only
      - name: Generate sample CSV and manifest
        run: python -m src.generator --output /tmp/axiom-generated
      - name: Assert counts, checksums and repeatability
        run: |
          python -m src.generator --output /tmp/axiom-regenerated
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          left = Path('/tmp/axiom-generated')
          right = Path('/tmp/axiom-regenerated')
          manifest = json.loads((left / 'manifest.json').read_text(encoding='utf-8'))
          expected = {'categories.csv': 12, 'products.csv': 240, 'customers.csv': 10000,
                      'orders.csv': 40000, 'campaigns.csv': 24, 'sessions.csv': 100000}
          actual = {k: v['rows'] for k, v in manifest['files'].items()}
          for filename, count in expected.items():
              assert actual[filename] == count
          assert actual['order_items.csv'] >= 40000
          assert actual['payments.csv'] >= 1
          assert actual['events.csv'] >= 100000
          assert len(actual) == 9
          assert manifest['validation']['status'] == 'passed'
          for filename, info in manifest['files'].items():
              content = (left / filename).read_bytes()
              assert content == (right / filename).read_bytes(), filename
              assert hashlib.sha256(content).hexdigest() == info['sha256']
              with (left / filename).open(newline='', encoding='utf-8') as handle:
                  assert sum(1 for _ in csv.DictReader(handle)) == info['rows']
          assert (left / 'manifest.json').read_bytes() == (right / 'manifest.json').read_bytes()
          print('PASS: nine CSV files, row counts, hashes and deterministic regeneration')
          PY
